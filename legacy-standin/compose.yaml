name: mc1105-employee
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: employee_service
      POSTGRES_USER: fixture
      POSTGRES_PASSWORD: fixture_only
    labels:
      mc1105: 'true'
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fixture -d employee_service']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: ..
      dockerfile: legacy-standin/Dockerfile
    environment:
      DATABASE_URL: postgresql://fixture:fixture_only@db/employee_service
    ports:
      - '127.0.0.1:8082:8081'
    labels:
      mc1105: 'true'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
